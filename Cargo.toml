[package]
name = "flac-bpm-analyzer"
version = "0.3.0"
edition = "2021"
# 最低支持的 Rust 版本（MSRV）。低于此版本编译会给出明确报错，而不是一堆语法/库 API 错误。
rust-version = "1.88"
# 解析器 v3 = 在 v2 基础上开启「MSRV 感知」：cargo update / cargo add 会优先挑选
# 与本项目 rust-version 兼容的依赖版本，避免把依赖升到需要更高 rustc 的版本。
resolver = "3"
description = "音频节拍分析器：导入单个 FLAC / MP3，自动估计 BPM，展示波形与节拍"

[features]
# 默认 = 桌面版（界面 + 播放）。
default = ["gui", "playback"]

# 图形界面：eframe/egui + 文件对话框（rfd）。
# 关掉后只剩命令行分析，二进制不含窗口代码，终端/服务器上可跑。
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

# 音频输出：rodio → cpal。Linux 下 cpal 走 alsa-sys，需要 alsa 开发包（见 README）。
# 关掉后播放退化为「模拟走时」，不链接任何 C 库。
playback = ["dep:rodio"]

[dependencies]
# ---------- GUI ----------
eframe = { version = "0.32", optional = true }      # egui 桌面壳层
egui = { version = "0.32", optional = true }        # 与 eframe 内置版本保持一致
egui_extras = { version = "0.32", optional = true } # 少量额外组件 / 图片加载支持

# ---------- 解码 ----------
# 只启用 flac + mp3，避免把 ogg/vorbis/aac 等无关编解码器拉进来
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3"] }

# ---------- 播放 ----------
# 只启用 playback（cpal 输出），我们自行喂 SamplesBuffer，不需要 rodio 自带的解码器
rodio = { version = "0.23", default-features = false, features = ["playback"], optional = true }

# ---------- 文件对话框 ----------
rfd = { version = "0.17", optional = true }

[profile.release]
opt-level = 3
