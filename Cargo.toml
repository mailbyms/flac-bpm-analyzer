[package]
name = "flac-bpm-analyzer"
version = "0.2.0"
edition = "2021"
# 最低支持的 Rust 版本（MSRV）。低于此版本编译会给出明确报错，而不是一堆语法/库 API 错误。
rust-version = "1.88"
# 解析器 v3 = 在 v2 基础上开启「MSRV 感知」：cargo update / cargo add 会优先挑选
# 与本项目 rust-version 兼容的依赖版本，避免把依赖升到需要更高 rustc 的版本。
resolver = "3"
description = "音频节拍分析器：导入单个 FLAC / MP3，自动估计 BPM，展示波形与节拍"

[dependencies]
# ---------- GUI ----------
eframe = "0.32"        # egui 桌面壳层
egui = "0.32"          # 与 eframe 内置版本保持一致
egui_extras = "0.32"   # 少量额外组件 / 图片加载支持

# ---------- 解码 ----------
# 只启用 flac + mp3，避免把 ogg/vorbis/aac 等无关编解码器拉进来
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3"] }

# ---------- 播放 ----------
# 只启用 playback（cpal 输出），我们自行喂 SamplesBuffer，不需要 rodio 自带的解码器
rodio = { version = "0.23", default-features = false, features = ["playback"] }

# ---------- 文件对话框 ----------
rfd = "0.17"

[profile.release]
opt-level = 3
